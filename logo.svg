<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#61dafb;#818cf8;#38bdf8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#38bdf8;#61dafb;#818cf8" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <circle cx="50" cy="50" r="26" fill="#38bdf8" opacity="0.3" filter="url(#glow)">
    <animate attributeName="r" values="24;32;24" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <g stroke="#1b2a41" stroke-width="3">
    <g opacity="1">
      <line x1="30" y1="4" x2="30" y2="14"/><line x1="70" y1="4" x2="70" y2="14"/>
      <line x1="30" y1="86" x2="30" y2="96"/><line x1="70" y1="86" x2="70" y2="96"/>
      <line x1="4" y1="30" x2="14" y2="30"/><line x1="4" y1="70" x2="14" y2="70"/>
      <line x1="86" y1="30" x2="96" y2="30"/><line x1="86" y1="70" x2="96" y2="70"/>
      <animate attributeName="stroke" values="#1b2a41;#38bdf8;#1b2a41" dur="2.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform-origin="50 50">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="14s" repeatCount="indefinite"/>
    <path d="M32 6 H68 L94 32 V68 L68 94 H32 L6 68 V32 Z" fill="#0a1120" stroke="url(#g)" stroke-width="3"/>
  </g>

  <text x="50" y="63" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="32" fill="url(#g)">HD</text>
</svg>
